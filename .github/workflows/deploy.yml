name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The whole suite gates the deploy, not just the accessibility half. A repo that
      # runs only test:a11y can publish a build whose arithmetic is broken so long as the
      # browser specs pass; 29 repos in this fleet were found in exactly that state.
      - name: Unit tests, differential vectors and coverage gate
        run: npm run test:coverage

      - name: Manifest is in sync with the claims it is generated from
        run: node verification/tools/build-manifest.mjs --check

      - name: Verification manifest validates
        run: npm run verify:manifest

      - name: Independent verifier
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility gate (axe, WCAG 2.1 A/AA) and claims suite
        run: npm run test:a11y

      # include-hidden-files, because v5 excludes dotted paths from the tarball by
      # default and dist/.nojekyll is a dotted path. Nothing on the Pages side runs
      # Jekyll over an uploaded artifact, so losing it would break nothing today — but
      # the file is on disk deliberately, as the guard for a branch-based deploy, and a
      # dependency bump is the wrong place to quietly stop shipping it.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
