name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The gate has to judge pull requests too, otherwise a Dependabot bump has no
  # signal to merge on and the auto-merge job below would have nothing to wait for.
  pull_request:
    branches: [main]
  # Required: a merge made with GITHUB_TOKEN raises no push event, so the deploy
  # after an auto-merge has to be asked for through the API. See the last job.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keyed on the ref, not a bare `pages`: with cancel-in-progress a pull request
  # run would otherwise cancel a live main deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The whole suite gates the deploy, not just the accessibility half. A repo that
      # runs only test:a11y can publish a build whose arithmetic is broken so long as the
      # browser specs pass; 29 repos in this fleet were found in exactly that state.
      - name: Unit tests, differential vectors and coverage gate
        run: npm run test:coverage

      - name: Manifest is in sync with the claims it is generated from
        run: node verification/tools/build-manifest.mjs --check

      - name: Verification manifest validates
        run: npm run verify:manifest

      - name: Independent verifier
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility gate (axe, WCAG 2.1 A/AA) and claims suite
        run: npm run test:a11y

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. `needs: build` is the whole safety argument -- every gate in
  # this lab (unit tests and the coverage thresholds, the manifest sync check, the
  # manifest validator, the independent verifier, the build, and the five browser
  # suites) has to go green on the pull request before a bump can merge itself.
  #
  # Majors are included here on purpose. That gate judges a bump far better than
  # its version number does; a major that actually breaks this lab fails it and the
  # pull request stays open for a human. What keeps majors out of the *grouped*
  # Dependabot PR is a separate concern -- see .github/dependabot.yml.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge any bump whose gate went green
        # Retry: a sibling pull request merging first moves main underneath us and
        # GitHub rejects with "Base branch was modified". That is benign, so try
        # again rather than failing the run over a race.
        run: |
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              exit 0
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          echo "::warning::gate passed but the merge did not land after 3 attempts;"
          echo "::warning::leaving this PR open - Dependabot will rebase and retry."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
      # them so workflows cannot retrigger themselves -- so `deploy` would never run
      # and the site would keep serving the previous build, with no red run anywhere
      # to say so. Ask for the deploy explicitly; a workflow_dispatch through the API
      # is not suppressed. The dispatched run is this same gate-then-deploy pipeline,
      # so a bad merge still ships nothing.
      - name: Deploy the merged result
        if: success()
        run: |
          if gh pr view "$PR_URL" --json state --jq .state | grep -q MERGED; then
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
              || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
