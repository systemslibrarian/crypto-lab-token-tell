open_questions:
  - id: "Q1"
    question: "Are the two published SynthID-Text implementations intended to interoperate, given that at the pinned versions they compute different g-values from the same keys?"
    why_it_matters: "It decides whether \"the watermark configuration\" means the key list or the key list plus a choice of construction, which is the difference between a detector that reads a mark and one that reads noise."
    what_would_resolve_it: "A first-party statement about compatibility across the change that removed the sampling table, or a released version of either implementation that matches the other."
  - id: "Q2"
    question: "Is the zero-initialised repeated-context history buffer intentional, given that a context hashing to exactly zero would be treated as already seen?"
    why_it_matters: "It is a one-in-2^64 event per position, so it cannot be observed empirically; but a reimplementation has to choose whether to copy it, and copying it silently is how an accidental behaviour becomes a specification."
    what_would_resolve_it: "A comment, test or issue in either implementation addressing the case."
  - id: "Q3"
    question: "Which is authoritative for the g-value derivation: the reference docstring, which describes taking the lowest three bits and adding them to the previous value, or the body it ships with, which shifts twelve times and reads bit 30?"
    why_it_matters: "They describe different functions. This build follows the body, which is what runs, but a reader comparing against the docstring will find a mismatch."
    what_would_resolve_it: "A corrected docstring, or a statement that the docstring describes an earlier version."
  - id: "Q4"
    question: "Does the exact null hold when the hash is a linear congruential generator rather than the pseudorandom function the paper assumes?"
    why_it_matters: "The exact p-value depends on the counted g-values being independent fair coins. If the generator biases them, published p-values are optimistic in a way no reader could detect from the number alone."
    what_would_resolve_it: "A null study at a scale that separates the two hypotheses — thousands of texts rather than the 48 measured here — or an analysis of the generator’s output under the specific key-mixing this construction uses."
  - id: "Q5"
    question: "What canonicalization does a conformant C2PA claim signature actually cover, and how far does the minimal ordering convention used here depart from it?"
    why_it_matters: "The page teaches that a signature covers exact bytes. If the byte-determining rule differs from the specification’s, the lesson is right and the artefact is not the thing it resembles."
    what_would_resolve_it: "Reading the specification’s COSE and JUMBF sections in full and either implementing them or documenting each departure."
  - id: "Q6"
    question: "What is the secret for SynthID image, audio and video, and does any published route let a third party check text they did not issue?"
    why_it_matters: "The page states issuer-only verification as a property of the construction. A publicly-checkable variant would change that from a consequence into a choice."
    what_would_resolve_it: "A first-party description of the media watermark’s detection requirements, or a published route that checks text without the configuration."
  - id: "Q7"
    question: "Should a published detection threshold be indexed by token count or by scored positions, given that a degenerate text can offer 320 tokens and a single scored position?"
    why_it_matters: "A threshold chosen by length is applied to evidence measured by position, and the two diverge exactly where a text is most unusual."
    what_would_resolve_it: "A threshold family indexed by scored positions, measured against a corpus large enough to populate the sparse end."
cryptographer_checklist:
  - "Confirm the mean g-score is the statistic intended, and that describing the Bayesian detector as out of scope is acceptable for a teaching build."
  - "Confirm the exact Binomial null is applied only where its independence premise is stated, and that the empirical comparison beside it is presented as a check rather than a confirmation."
  - "Confirm the wrong-key null and the corpus null are described as answering different questions, and that neither is presented as the other."
  - "Confirm the cross-implementation result is scoped to the pinned versions and is not stated as a defect in either implementation."
  - "Confirm the non-distortionary property is stated no more broadly than Theorem 18 supports: two competitors per match, in expectation over the seed, at a single decoding step."
  - "Confirm the C2PA panel is described as shaped rather than conformant everywhere it appears, including the manifest disclosure."
  - "Confirm no threshold on the page is presented as general, and that each carries the corpus it came from."
  - "Confirm the published demo keys are described as published, and that the page never implies the mark they produce is unforgeable."
